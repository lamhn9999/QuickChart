<!DOCTYPE html>
<html lang = "en_US">
<head>
    <meta charset = "UTF-8">
    <title>LQ UI Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/home/lam/LQ/LQ/wwwroot/node_modules/chart.js/dist/chart.umd.min.js"></script>
    <link href="/home/lam/LQ/LQ/wwwroot/output.css" rel="stylesheet">
</head>
<body>
<div class="flex flex-col h-screen">
    <!-- Header -->
    <div class="flex">
        <div class="text-lg">HELLO</div>
    </div>

    <!-- Content -->
    <div class="flex flex-1 flex-col md:flex-row">
        <!-- Left panel -->
        <div
                id="tablePanel"
                class="rounded-r-lg bg-amber-400 cursor-grab
                   w-full md:w-1/2 md:min-w-1/5"
        ></div>

        <!-- Resizer -->
        <div
                id="drag"
                class="hidden md:block mx-1 w-1 rounded-full
                   cursor-col-resize bg-gray-500"
        ></div>

        <!-- Right panel stack -->
        <div class="flex flex-col flex-1 w-full md:min-w-1/5">
            <div class="rounded-l-lg flex-1 bg-amber-700"></div>
            <div class="rounded-l-lg flex-1 bg-amber-600"></div>
            <div class="rounded-l-lg flex-1 bg-amber-500"></div>
            <div class="rounded-l-lg flex-1 bg-amber-400"></div>
        </div>
    </div>
</div>


<script>
    const resizer = document.getElementById('drag');
    const left = document.getElementById('tablePanel');

    let startX = 0;
    let startWidth = 0;
    let isDragging = false;

    resizer.addEventListener('mousedown', e => {
        isDragging = true;

        startX = e.clientX;
        startWidth = left.getBoundingClientRect().width;

        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', e => {
        if (!isDragging) return;

        const dx = e.clientX - startX;
        left.style.width = `${startWidth + dx}px`;
    });

    document.addEventListener('mouseup', () => {
        isDragging = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    });
</script>
</body>
</html>
