<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heatmap with Chartjs Matrix Plugin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@1.3.0"></script>
    <link rel="stylesheet" href="/home/lam/LQ/LQ/wwwroot/style_tw.css"/>
    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
        }
        canvas {
            width: 800px;
            height: 400px;
        }
    </style>
    
</head>
<body>
<div class="w-64 p-4 bg-zinc-900 rounded-xl shadow-xl">
    <input type="color" id="hiddenPicker" class="hidden">

    <div id="preview"
         class="w-full h-12 rounded-lg cursor-pointer border border-zinc-700">
    </div>

    <input id="hexInput"
           class="mt-3 w-full bg-zinc-800 text-white px-3 py-2 rounded-lg outline-none"
           placeholder="#000000">
</div>

<canvas id="incomeHeatmap"></canvas>
<canvas id="incomeScatterPlot"></canvas>

<script>
    const heatmapData = [
        { x: "Married", y: "Car", v: 1800 },
        { x: "Married", y: "House", v: 2100 },
        { x: "Separated", y: "Car", v: 1400 },
        { x: "Separated", y: "House", v: 1600 },
        { x: "Alone", y: "Car", v: 1100 },
        { x: "Alone", y: "House", v: 1300 }
    ];

    const allValues = heatmapData.map(d => d.v);
    const minVal = Math.min(...allValues);
    const maxVal = Math.max(...allValues);

    new Chart(document.getElementById("incomeHeatmap"), {
        type: "matrix",
        data: {
            datasets: [{
                label: "Mean Income",
                data: heatmapData,
                borderColor: "#fff",
                borderWidth: 1,
                backgroundColor(ctx) {
                    const val = ctx.dataset.data[ctx.dataIndex].v;
                    const t = (val - minVal) / (maxVal - minVal);
                    return `rgba(0, 123, 255, ${t})`;
                },
                width({chart}) {
                    const area = chart.chartArea;
                    return area ? (area.right - area.left) / 3 - 2 : 0;
                },
                height({chart}) {
                    const area = chart.chartArea;
                    return area ? (area.bottom - area.top) / 2 - 2 : 0;
                }
            }]
        },
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: "Mean Income Heatmap by Family Status & Asset"
                },
                tooltip: {
                    callbacks: {
                        label(ctx) {
                            const d = ctx.raw;
                            return `${d.y} / ${d.x}: ${d.v}`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    type: "category",
                    labels: ["Married", "Separated", "Alone"],
                    grid: { display: false },
                    offset: true
                },
                y: {
                    type: "category",
                    labels: ["Car", "House"],
                    grid: { display: false },
                    offset: true
                }
            }
        }
    });
</script>

<script>
    function generateRandomPoints(n) {
        const points = [];
        for (let i = 0; i < n; i++) {
            points.push({
                x: Math.random() * 20 - 10, 
                y: Math.random() * 20 - 10
            });
        }
        return points;
    }

    const scatterData = {
        datasets: [
            {
                label: 'Scatter Dataset',
                data: generateRandomPoints(50),
            },
            {
                label: 'Scatter Dataset 2',
                data: generateRandomPoints(50),
            }
        ]
    };
    const config = {
        type: 'scatter',
        data: scatterData,
        options: {
            scales: {
                x: {
                    type: 'linear',
                    position: 'bottom'
                }
            }
        }
    };
    new Chart(document.getElementById("incomeScatterPlot"), config);
</script>

<script>
    const hiddenPicker = document.getElementById("hiddenPicker");
    const preview = document.getElementById("preview");
    const hexInput = document.getElementById("hexInput");

    preview.addEventListener("click", () => {
        hiddenPicker.click();
    });

    hiddenPicker.addEventListener("input", (e) => {
        const color = e.target.value;
        preview.style.backgroundColor = color;
        hexInput.value = color;
    });

    hexInput.addEventListener("input", (e) => {
        const color = e.target.value;
        preview.style.backgroundColor = color;
    });
</script>

<!-- Tailwind safelist: classes dynamically applied in JS — never remove -->
<!-- per-chart filter button on chart-card toolbar (builder.js useAsFilter btn). -->
<div class="hidden
  hover:text-[#2383E2] hover:border-[#2383E2]/30 hover:bg-[#2383E2]/5
  disabled:opacity-30 disabled:cursor-not-allowed
  disabled:hover:text-zinc-500 disabled:hover:border-zinc-200 disabled:hover:bg-white
"></div>
<!-- per-chart filter card external left toolbar (per-chart-filter/toolbar.js):
     drag-handle wrapper + remove btn + copy-to-file dropdown rows. The
     hover:bg-[#2383E2]/10 utility is unique to the copy-panel rows; the
     accent-blue hover utilities and rounded-l-xl don't appear elsewhere in
     compiled JS. -->
<div class="hidden
  rounded-l-xl
  hover:bg-[#2383E2]/10
"></div>
<div class="hidden
  grid grid-cols-4
  gap-[5px] gap-[7px] gap-1 gap-0.5 gap-1.5 gap-2
  pl-1.5 pr-2.5 px-2 px-3 py-1 py-1.5 py-2 py-3 pb-3 pb-2.5 pt-2 pt-3 mt-2
  w-3 h-3 w-5 h-5 w-7 h-7 h-10 h-14 w-[22px] w-[52px] w-[15px] h-[15px] h-[22px]
  left-0.5 top-px top-[calc(100%+8px)] -left-[11px] top-1/2 -translate-y-1/2
  rounded-[5px] rounded-[7px] rounded-[10px] rounded-[14px] rounded-l-md rounded-md rounded-lg
  shadow-[0_1px_4px_rgba(0,0,0,.22)]
  shadow-[0_12px_36px_rgba(0,0,0,.11),0_2px_8px_rgba(0,0,0,.06)]
  shadow-[-2px_0_6px_rgba(0,0,0,0.06)]
  transition-all transition-[background] transition-[border-color,color,box-shadow] transition-colors
  duration-[120ms] duration-100 duration-150
  text-[7.5px] text-[10px] text-[11px] text-white/90
  tracking-[.025em] tracking-[0.08em]
  opacity-0 opacity-30 opacity-100 cursor-not-allowed cursor-default cursor-pointer
  bg-[#E9967A]/10 border-[#E9967A]/30 text-[#E9967A]
  bg-[#FAFAFA] bg-[#E9967A] hover:bg-[#e08060] active:bg-[#d0705a]
  focus:border-[#E9967A]/50
  border-zinc-100 border-zinc-200/70 border-zinc-200/80
  text-zinc-300 text-zinc-400 text-zinc-600
  hover:bg-zinc-50 hover:bg-zinc-50/80 hover:text-zinc-700 hover:text-zinc-800 hover:border-zinc-300
  select-none [&_svg]:w-full [&_svg]:h-full
  whitespace-nowrap flex-shrink-0 flex-1 min-w-0
  italic uppercase overflow-hidden text-ellipsis
"></div>
</body>
</html>
